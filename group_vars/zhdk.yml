api_basic_auth_enabled: false

reverse_proxy_use_x_forwarded_for: true

remote_pgbin_restore_path: /leihs/var/db-backups/latest.pgbin

publish_inventory: True

# show "new inventory" button in legacy manage topbar (deploy default is false)
legacy_show_new_inventory_button: true

leihs_virtual_hosts:
- hostname: '{{leihs_external_hostname}}'
  ip: '*'
  ssl_certificate_file: '/etc/ssl/localcerts/{{ansible_host}}.crt'
  ssl_certificate_key_file: '/etc/ssl/localcerts/{{ansible_host}}.key'
  force_redirect_to_https: yes


zhdk_prtg_url: NULL # NULL for deployment to test / staging environment, set in prod hostvar 
zhdk_zapi_key: '{{zapi_key_dev}}' # set to dev key for deployment to test / staging environment, set to prod key in prod hostvar